name: Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional note shown in the build summary'
        required: false
        default: 'Manual build'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Default signing material for this personal-use project.
  # Override by defining repository secrets of the same name if you ever want to.
  US_STORE_PASSWORD: ${{ secrets.US_STORE_PASSWORD || 'uscopilot' }}
  US_KEY_ALIAS: ${{ secrets.US_KEY_ALIAS || 'us-release' }}
  US_KEY_PASSWORD: ${{ secrets.US_KEY_PASSWORD || 'uscopilot' }}

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Enforce max file size (500-600 line rule)
        run: bash scripts/check_file_size.sh

      - name: Ensure release keystore exists
        run: |
          set -euo pipefail
          KS="app/keystore/release.jks"
          if [ -f "$KS" ]; then
            echo "Using committed keystore at $KS"
          else
            echo "No keystore committed - generating the default one."
            mkdir -p app/keystore
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias "$US_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$US_STORE_PASSWORD" \
              -keypass "$US_KEY_PASSWORD" \
              -dname "CN=Us Relationship Co-Pilot, OU=Personal, O=Us, L=Kathmandu, S=Bagmati, C=NP"
          fi
          keytool -list -keystore "$KS" -storepass "$US_STORE_PASSWORD" | head -n 20

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y-%m-%d)
          NAME="Us-v${VERSION_NAME}-${VERSION_CODE}-${SHORT_SHA}-${DATE}-release.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Rename, verify and report APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then echo "::error::No release APK produced"; exit 1; fi
          mkdir -p artifacts
          DEST="artifacts/${{ steps.meta.outputs.apk_name }}"
          cp "$SRC" "$DEST"

          SIZE_BYTES=$(stat -c%s "$DEST")
          SIZE_HUMAN=$(du -h "$DEST" | cut -f1)
          SHA256=$(sha256sum "$DEST" | cut -d' ' -f1)

          echo "=============================================="
          echo " APK PATH   : $(realpath "$DEST")"
          echo " APK SIZE   : $SIZE_HUMAN ($SIZE_BYTES bytes)"
          echo " APK SHA256 : $SHA256"
          echo "=============================================="

          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$DEST" || \
            echo "::warning::apksigner verification reported issues"

          echo "$SHA256  ${{ steps.meta.outputs.apk_name }}" > artifacts/SHA256SUMS.txt
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "### Us — Release APK"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| File | \`${{ steps.meta.outputs.apk_name }}\` |"
            echo "| Version | ${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.version_code }}) |"
            echo "| Size | $SIZE_HUMAN |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo ""
            echo "Download it from the **us-release-apk** artifact below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: us-release-apk
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **Us — Relationship Co-Pilot** ${{ github.ref_name }}

            - APK: `${{ steps.meta.outputs.apk_name }}`
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
