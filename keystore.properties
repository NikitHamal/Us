# Default release keystore for this personal-use project.
# Committed on purpose so GitHub Actions can sign every build without manual secrets.
# Override in CI by setting US_STORE_FILE / US_STORE_PASSWORD / US_KEY_ALIAS / US_KEY_PASSWORD.
storeFile=keystore/release.jks
storePassword=uscopilot
keyAlias=us-release
